<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline | National Polytechnic Institute (NPI) Dhaka</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); color: #0f172a; text-align: center; }
    .icon { width: 88px; height: 88px; border-radius: 50%; background: #0186C0; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: 900; margin-bottom: 24px; box-shadow: 0 10px 40px rgba(1,134,192,0.25); }
    h1 { font-size: clamp(1.5rem, 5vw, 2.25rem); font-weight: 900; color: #0f172a; margin-bottom: 12px; letter-spacing: -0.02em; }
    p  { font-size: clamp(0.95rem, 3vw, 1.1rem); color: #334155; max-width: 520px; line-height: 1.6; margin-bottom: 28px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 999px; background: #0186C0; color: white; font-weight: 700; text-decoration: none; border: none; cursor: pointer; font-size: 1rem; transition: all .2s; box-shadow: 0 10px 25px rgba(1,134,192,0.2); }
    .btn:hover { background: #016ea3; transform: translateY(-1px); box-shadow: 0 14px 30px rgba(1,134,192,0.25); }
    .logo { margin-top: 36px; color: #0186C0; font-weight: 900; letter-spacing: 0.02em; }
    .logo span { color: #0f172a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">!</div>
    <h1>You're Offline</h1>
    <p>Your internet connection appears to be unavailable. Please check your Wi-Fi or mobile data and try again. Previously loaded pages may still be available.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <div class="logo">NPI<span> DHAKA</span></div>
  </div>
</body>
</html>
